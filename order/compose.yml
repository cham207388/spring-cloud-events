services:
  order:
    container_name: order
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://events-db:5432/events?currentSchema=orders_space
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      events-db:
        condition: service_healthy
    extends:
      file: ../compose-config.yml
      service: microservice-base

networks:
  events:
    driver: bridge